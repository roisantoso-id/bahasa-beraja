services:
  pimi-bahasa:
    build: .
    ports:
      - "80:3000"
    container_name: pimi-bahasa-app
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    networks:
      - tools_network
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm start

networks:
  tools_network:
    external: true 